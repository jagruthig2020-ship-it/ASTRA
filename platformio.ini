[platformio]
default_envs = main_controller, supervisor

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@6.21.5
build_flags = -Wall

[env:main_controller]
build_src_filter = +<main_controller.cpp>
lib_deps =
  ${env.lib_deps}
  paulstoffregen/OneWire@2.3.8
  milesburton/DallasTemperature@3.11.0

[env:supervisor]
build_src_filter = +<supervisor.cpp>
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit SSD1306@2.5.13
  adafruit/Adafruit GFX Library@1.11.11
